name: itqan_academy
description: "A new Flutter project for Itqan Academy."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter

  # مكتبات إدارة البيانات والشبكة
  dio: ^5.8.0+1
  http: ^1.3.0
  pretty_dio_logger: ^1.4.0
  supabase_flutter: ^2.10.3
  shared_preferences: ^2.5.3
  app_links: ^6.3.3
  connectivity_plus: ^6.1.1

  # مكتبات الميديا والفيديو
  youtube_player_flutter: ^9.1.1
  youtube_explode_dart: ^3.0.5
  video_player: ^2.10.0
  chewie: ^1.11.3
  cached_network_image: ^3.4.1

  # إدارة الحالة والمنطق (Logic)
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  path: ^1.9.1
  path_provider: ^2.1.5

  # Firebase والإشعارات
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^19.5.0

  # واجهة المستخدم (UI) وأدوات إضافية
  shimmer: ^3.0.0
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  flutter_html: ^3.0.0
  url_launcher: ^6.3.1
  fluttertoast: ^8.2.12
  font_awesome_flutter: ^10.9.1
  google_fonts: ^6.2.1
  flutter_blurhash: ^0.8.2

  # الترجمة
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  intl_utils: ^2.8.11
  # أداة توليد الأيقونات
  flutter_launcher_icons: ^0.14.3

# إعدادات أيقونة التطبيق (App Icon)

flutter:
  uses-material-design: true
  generate: true # ضرورية لملفات الترجمة والـ Localization

  assets:
    - assets/images/
    - "assets/images/itqan_logo.png"

  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo/Cairo-VariableFont_slnt,wght.ttf
        - asset: fonts/Cairo/static/Cairo-Bold.ttf
          weight: 700

# تفعيل أداة الترجمة التلقائية
flutter_intl:
  enabled: true
